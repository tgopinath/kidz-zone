<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="description" content="KidZ Zone: one place for children aged 4–12 to learn words, read, count money, solve puzzles, train their brain, raise a pet, explore maps and go shopping." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Lato is Kolam's type; Andika is a reading font for early readers (Word Garden's words); Noto Sans Tamil for Map Explorer's Tamil voice labels -->
    <!-- loaded without blocking the first paint (system font until Lato arrives, display=swap) -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Andika:wght@400;700&family=Noto+Sans+Tamil:wght@400..700&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Andika:wght@400;700&family=Noto+Sans+Tamil:wght@400..700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <!-- Native looks only inside the phone apps: Material 3 in the Android app, Apple HIG in the iPhone app. Inert in a browser. -->
    <script>
      /* Phone browsers get the phone app's look too (Kolam kits below): Apple HIG on iPhone and iPad, Material 3 on
         other phones. Only when this tab has no choice yet; ?app=web, ?app=android or ?app=ios always wins. */
      (function () {
        try {
          if (/[?&]app=(web|android|ios)\b/.test(location.search)) return
          if (sessionStorage.getItem('kolam.app') || sessionStorage.getItem('k-app-mode')) return
          var phone = matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) <= 820
          if (!phone) return
          var ua = navigator.userAgent
          var apple = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)
          if (apple) sessionStorage.setItem('kolam.app', 'ios')
          else { sessionStorage.setItem('k-app-mode', 'android'); sessionStorage.setItem('kolam.app', 'android') }
        } catch (e) {}
      })()
    </script>
    <!-- The kits' styles block the first paint only where a phone look is used (phone apps, phone browsers, ?app=…);
         a desktop browser loads them without waiting. The kits' scripts are deferred (they run before the app). -->
    <script>
      (function () {
        var css = ['https://tgopinath.github.io/kolam-design-system/m3/kolam-m3.css', 'https://tgopinath.github.io/kolam-design-system/ios/kolam-ios.css']
        var phoneLook = false
        try {
          phoneLook = /[?&]app=(android|ios)\b/.test(location.search) || /^(android|ios)$/.test(sessionStorage.getItem('kolam.app') || '') ||
            /KidzZone-iOS|KidZZone-iOS|; wv\)|Capacitor/i.test(navigator.userAgent)
        } catch (e) {}
        css.forEach(function (href) {
          var l = document.createElement('link')
          l.rel = 'stylesheet'
          l.href = href
          if (!phoneLook) { l.media = 'print'; l.onload = function () { l.media = 'all' } } else l.setAttribute('blocking', 'render')
          document.head.appendChild(l)
        })
      })()
    </script>
    <script defer src="https://tgopinath.github.io/kolam-design-system/m3/kolam-m3.js"></script>
    <script defer src="https://tgopinath.github.io/kolam-design-system/ios/kolam-ios.js"></script>
    <title>KidZ Zone</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
